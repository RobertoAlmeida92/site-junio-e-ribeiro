<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="540" height="130">
  <defs>
    <style>
      .jrJ  { font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; font-weight: 400; font-size: 52px; fill: #FFFFFF; }
      .jrAmp{ font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; font-weight: 400; font-size: 22px; fill: #FFFFFF; }
      .jrR  { font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; font-weight: 400; font-size: 52px; fill: #FFFFFF; }
      .ttl  { font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; font-weight: 600; font-size: 19px; fill: #FFFFFF; letter-spacing: 4px; }
      .sub  { font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; font-weight: 400; font-size: 7px;  fill: rgba(215,200,165,0.88); letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Fundo azul-marinho solido -->
  <rect x="4" y="3" width="116" height="124" fill="#0B1630"/>

  <!-- Canto L dourado - superior esquerdo -->
  <line x1="4"  y1="3"  x2="60"  y2="3"   stroke="#C9A030" stroke-width="1.8" stroke-linecap="square"/>
  <line x1="4"  y1="3"  x2="4"   y2="66"  stroke="#C9A030" stroke-width="1.8" stroke-linecap="square"/>
  <!-- Canto L dourado - inferior direito -->
  <line x1="64" y1="127" x2="120" y2="127" stroke="#C9A030" stroke-width="1.8" stroke-linecap="square"/>
  <line x1="120" y1="64" x2="120" y2="127" stroke="#C9A030" stroke-width="1.8" stroke-linecap="square"/>

  <!-- Moldura interna quadrada borda azul-clara -->
  <rect x="15" y="14" width="90" height="100" fill="none" stroke="rgba(160,185,220,0.55)" stroke-width="1.0"/>

  <!-- Monograma J &amp; R -->
  <text x="22" y="88" class="jrJ">J</text>
  <text x="62" y="79" class="jrAmp">&amp;</text>
  <text x="75" y="88" class="jrR">R</text>

  <!-- Tipografia da marca -->
  <g transform="translate(148, 27)">
    <text x="0" y="38" class="ttl">JUNIO E RIBEIRO</text>
    <line x1="0" y1="46" x2="360" y2="46" stroke="#C9A030" stroke-width="0.7" opacity="0.45"/>
    <text x="0" y="59" class="sub">ADVOCACIA E CONSULTORIA JURI&#769;DICA</text>
  </g>
</svg>
