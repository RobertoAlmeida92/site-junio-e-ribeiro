<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Montserrat:wght@400;500;600&amp;display=swap');
      .gold-frame { stroke: #C9A03F; stroke-width: 1.5; fill: none; }
      .blue-frame { stroke: rgba(255, 255, 255, 0.4); stroke-width: 1.5; fill: none; }
      .mono-text { font-family: 'Cinzel', Georgia, serif; font-size: 52px; font-weight: 600; fill: #FFFFFF; }
      .brand-title { font-family: 'Cinzel', Georgia, serif; font-size: 21px; font-weight: 700; fill: #FFFFFF; letter-spacing: 2.5px; }
      .brand-sub { font-family: 'Montserrat', sans-serif; font-size: 9px; font-weight: 500; fill: #C9A03F; letter-spacing: 3.5px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Monograma J&R com moldura dupla deslocada (Identidade do Manual J&R) -->
  <g transform="translate(10, 10)">
    <!-- Moldura Dourada Deslocada -->
    <rect x="0" y="0" width="100" height="100" class="gold-frame" />
    <!-- Moldura Interna -->
    <rect x="12" y="12" width="100" height="100" class="blue-frame" />
    <!-- Texto J & R (aumentado para maior destaque) -->
    <text x="62" y="77" text-anchor="middle" class="mono-text">J &amp; R</text>
  </g>

  <!-- Tipografia da Marca -->
  <g transform="translate(145, 25)">
    <!-- Nome de cima (reduzido de 26px para 21px) -->
    <text x="0" y="38" class="brand-title">JUNIO E RIBEIRO</text>
    <!-- Subtítulo / Consultoria Jurídica (reduzido de 11px para 9px) -->
    <text x="2" y="62" class="brand-sub">ADVOCACIA E CONSULTORIA JURÍDICA</text>
  </g>
</svg>
