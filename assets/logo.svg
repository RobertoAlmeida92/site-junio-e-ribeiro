<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 140" width="580" height="140">
  <defs>
    <style>
      .jrJ  { font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; font-weight: 400; font-size: 58px; fill: #FFFFFF; }
      .jrAmp{ font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; font-weight: 400; font-size: 24px; fill: #FFFFFF; }
      .jrR  { font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; font-weight: 400; font-size: 58px; fill: #FFFFFF; }
      .ttl  { font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; font-weight: 400; font-size: 21px; fill: #FFFFFF; letter-spacing: 5px; }
      .sub  { font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; font-weight: 400; font-size: 8px;  fill: rgba(210,200,175,0.82); letter-spacing: 3.5px; }
    </style>
  </defs>

  <!-- Bloco principal azul-marinho (quadrado) -->
  <rect x="18" y="10" width="118" height="120" fill="#0C1A36"/>

  <!-- Moldura interna branca/clara (completa) -->
  <rect x="30" y="22" width="94" height="96" fill="none" stroke="rgba(200,215,235,0.60)" stroke-width="1.1"/>

  <!--
    L DOURADO — apenas canto SUPERIOR-ESQUERDO
    Linha horizontal: de x=8 ate x=72  (topo, y=8)
    Linha vertical:   de y=8 ate y=75  (lado esq, x=8)
  -->
  <line x1="8"  y1="8"  x2="73"  y2="8"  stroke="#C9A030" stroke-width="1.8" stroke-linecap="square"/>
  <line x1="8"  y1="8"  x2="8"   y2="76" stroke="#C9A030" stroke-width="1.8" stroke-linecap="square"/>

  <!-- Monograma J & R (centralizado no bloco) -->
  <text x="30" y="97" class="jrJ">J</text>
  <text x="73" y="84" class="jrAmp">&amp;</text>
  <text x="88" y="97" class="jrR">R</text>

  <!-- Linha vertical separadora entre bloco e texto -->
  <line x1="152" y1="22" x2="152" y2="118" stroke="rgba(200,215,235,0.35)" stroke-width="0.9"/>

  <!-- Tipografia da marca (verticalmente centralizada) -->
  <g transform="translate(168, 0)">
    <!-- JUNIO E RIBEIRO -->
    <text x="0" y="72" class="ttl">JUNIO E RIBEIRO</text>
    <!-- ADVOCACIA E / CONSULTORIA JURIDICA -->
    <text x="0" y="89" class="sub">ADVOCACIA E CONSULTORIA JURI&#769;DICA</text>
  </g>
</svg>
